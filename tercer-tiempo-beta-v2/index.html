  <style>
    :root {
      --pitch-deep: #052e22;
      --pitch: #073f2e;
      --grass: #0f7a55;
      --lime: #b7e875;
      --cream: #f4f2e9;
      --surface: #fffefa;
      --ink: #12221b;
      --muted: #617168;
      --line: #dbe3dc;
      --shadow: 0 24px 70px rgba(5, 46, 34, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        linear-gradient(rgba(5, 46, 34, 0.78), rgba(5, 46, 34, 0.9)),
        url('./assets/cancha-fondo.jpg') center / cover fixed;
      color: var(--ink);
      font-size: 16px;
    }

    button,
    input,
    select { font: inherit; }

    button,
    a { -webkit-tap-highlight-color: transparent; }

    .app-shell {
      position: relative;
      display: flex;
      min-height: 100vh;
      max-width: 42rem;
      margin: 0 auto;
      flex-direction: column;
      overflow: hidden;
      background: #eff4ee;
      box-shadow: var(--shadow);
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 1rem 1.25rem 1.1rem;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(circle at 85% 10%, rgba(183, 232, 117, 0.24), transparent 32%),
        linear-gradient(135deg, var(--pitch-deep), var(--pitch) 72%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.13);
    }

    .app-header::after {
      position: absolute;
      right: -4.5rem;
      bottom: -7rem;
      width: 15rem;
      height: 15rem;
      content: '';
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      box-shadow: 0 0 0 2.5rem rgba(255, 255, 255, 0.035);
      pointer-events: none;
    }

    .app-header > * { position: relative; z-index: 1; }

    .brand-icon {
      display: grid;
      width: 3.25rem;
      height: 3.25rem;
      flex: 0 0 auto;
      place-items: center;
      overflow: hidden;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 1rem;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    }

    .brand-icon img { display: block; width: 100%; height: 100%; }

    .brand-kicker {
      margin: 0 0 0.12rem;
      color: var(--lime);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 0;
      color: white;
      font-size: clamp(1.15rem, 5vw, 1.4rem);
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.1;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 0.25rem;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.875rem;
      font-weight: 700;
    }

    .portal-back {
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      flex: 0 0 auto;
      place-items: center;
      color: white;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.9rem;
      transition: transform 160ms ease, background 160ms ease;
    }

    .portal-back:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateX(-2px);
    }

    .welcome-strip {
      display: grid;
      min-height: 9.5rem;
      align-content: end;
      gap: 0.4rem;
      padding: 1.15rem 1.25rem;
      background:
        linear-gradient(180deg, rgba(5, 46, 34, 0.16), rgba(5, 46, 34, 0.9)),
        url('./assets/cancha-fondo.jpg') center 58% / cover;
      border-bottom: 3px solid var(--lime);
    }

    .welcome-kicker {
      color: var(--lime);
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      text-transform: uppercase;
    }

    .welcome-strip p {
      margin: 0;
      max-width: 31rem;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.45;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.72);
    }

    .app-main {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 1.25rem;
      padding: 1.1rem 1.25rem 2rem;
      overflow-x: hidden;
    }

    .app-tabs {
      position: static;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem;
      padding: 0.45rem;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(5, 46, 34, 0.11);
      border-radius: 1.2rem;
      box-shadow: 0 10px 24px rgba(5, 46, 34, 0.1);
    }

    .app-tab {
      display: flex;
      min-width: 0;
      min-height: 4.7rem;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.65rem 0.2rem;
      color: #718078;
      background: transparent;
      border: 0;
      border-radius: 0.9rem;
      font-size: 0.9rem;
      font-weight: 900;
      line-height: 1.2;
      transition: color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .app-tab svg { width: 1.35rem; height: 1.35rem; }

    .app-tab:hover:not(:disabled) {
      color: var(--pitch);
      background: #eef4ed;
    }

    .app-tab.is-active {
      color: white;
      background: linear-gradient(145deg, var(--grass), var(--pitch));
      box-shadow: 0 8px 18px rgba(7, 63, 46, 0.23);
      transform: translateY(-1px);
    }

    .app-tab:disabled { cursor: not-allowed; opacity: 0.38; }

    .panel-card {
      background: var(--surface);
      border-color: rgba(5, 46, 34, 0.11) !important;
      border-radius: 1.35rem !important;
      box-shadow: 0 14px 34px rgba(5, 46, 34, 0.07) !important;
    }

    .app-shell h2 { font-size: 1.125rem; line-height: 1.35; }

    .app-shell label { font-size: 0.875rem; line-height: 1.4; }

    .app-shell .text-xs { font-size: 0.875rem; line-height: 1.4; }
    .app-shell .text-sm { font-size: 1rem; line-height: 1.45; }

    .app-shell [class*="text-[9px]"],
    .app-shell [class*="text-[10px]"],
    .app-shell [class*="text-[11px]"] { font-size: 0.8125rem; line-height: 1.4; }

    .app-shell input,
    .app-shell select {
      min-height: 3rem;
      font-size: 1rem;
      border-color: var(--line) !important;
    }

    .app-shell input:focus,
    .app-shell select:focus {
      border-color: var(--grass) !important;
      box-shadow: 0 0 0 4px rgba(15, 122, 85, 0.1);
    }

    .app-shell button.bg-emerald-600 {
      min-height: 3rem;
      background: linear-gradient(145deg, #149167, var(--grass));
      box-shadow: 0 10px 22px rgba(15, 122, 85, 0.2);
    }

    .app-shell button.bg-gray-900 {
      min-height: 3rem;
      background: linear-gradient(145deg, #173d31, var(--pitch-deep));
      box-shadow: 0 10px 22px rgba(5, 46, 34, 0.17);
    }

    .category-grid button { min-height: 4.65rem; font-size: 0.8rem; }

    .summary-stat {
      border-color: rgba(5, 46, 34, 0.11) !important;
      box-shadow: 0 10px 24px rgba(5, 46, 34, 0.07) !important;
    }

    .summary-stat:first-child {
      color: white;
      background: linear-gradient(145deg, var(--grass), var(--pitch));
    }

    .summary-stat:first-child span { color: white !important; }
    .summary-stat:first-child span:first-child { color: var(--lime) !important; }

    .app-toast {
      animation: toast-in 220ms ease-out both;
    }

    .app-footer {
      padding: 1rem 1.25rem calc(1rem + env(safe-area-inset-bottom));
      color: rgba(255, 255, 255, 0.72);
      text-align: center;
      background: var(--pitch-deep);
      border-top: 3px solid var(--lime);
    }

    .app-footer p { margin: 0; font-size: 0.76rem; font-weight: 800; letter-spacing: 0.04em; }

    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #9caaa1; border-radius: 9999px; }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .pb-safe { padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
      .mb-safe { margin-bottom: env(safe-area-inset-bottom); }
    }

    @media (min-width: 44rem) {
      body { padding: 1.5rem; }
      .app-shell { min-height: calc(100vh - 3rem); border-radius: 1.75rem; }
      .app-header { position: relative; }
      .welcome-strip { min-height: 11rem; }
    }

    @media (max-width: 25rem) {
      .app-header { padding-inline: 1rem; }
      .welcome-strip,
      .app-main { padding-inline: 0.9rem; }
      .brand-icon { width: 3rem; height: 3rem; }
      .brand-title { font-size: 1.08rem; }
      .app-tab { min-height: 4.5rem; font-size: 0.875rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* --- RENOVACIÓN BETA: MATCH DAY --- */

        gap: 0.6rem;
        margin-top: 1.5rem;
      }

      .rail-stat {
        padding: 0.8rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 0.9rem;
        backdrop-filter: blur(10px);
      }

      .rail-stat span { display: block; color: rgba(255, 255, 255, 0.63); font-size: 0.72rem; font-weight: 800; }
      .rail-stat strong { display: block; margin-top: 0.2rem; color: white; font-size: 1.05rem; font-weight: 950; }

      .rail-nav { display: grid; gap: 0.45rem; margin-top: 1.6rem; }

      .rail-step {
        display: grid;
        grid-template-columns: 2.5rem minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.7rem;
        width: 100%;
        min-height: 3.6rem;
        padding: 0.55rem 0.7rem;
        color: rgba(255, 255, 255, 0.68);
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 0.95rem;
        transition: background 160ms ease, border 160ms ease, color 160ms ease;
      }

      .rail-step:hover:not(:disabled) { color: white; background: rgba(255, 255, 255, 0.08); }
      .rail-step.is-active { color: #082e22; background: #c5ef74; border-color: rgba(255, 255, 255, 0.45); }
      .rail-step:disabled { opacity: 0.35; }

      .rail-step-icon {
        display: grid;
        width: 2.5rem;
        height: 2.5rem;
        place-items: center;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 0.75rem;
      }

      .rail-step.is-active .rail-step-icon { background: rgba(5, 46, 34, 0.1); }
      .rail-step-label strong { display: block; font-size: 0.9rem; font-weight: 900; }
      .rail-step-label span { display: block; margin-top: 0.1rem; font-size: 0.7rem; font-weight: 700; opacity: 0.78; }
      .rail-step-number { font-size: 0.72rem; font-weight: 900; }

      .rail-footer a { display: inline-flex; align-items: center; gap: 0.45rem; color: rgba(255, 255, 255, 0.72); font-size: 0.8rem; font-weight: 800; }

      .beta-workspace { min-height: 100vh; background: #eef3ef; }

      .desktop-page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 2rem;
        max-width: 52rem;
        margin: 0 auto;
        padding: 2.4rem 2rem 1.25rem;
        border-bottom: 1px solid #d4e0d8;
      }

      .desktop-heading-copy p { max-width: 35rem; margin: 0.6rem 0 0; color: #63756a; font-size: 0.95rem; font-weight: 600; line-height: 1.5; }
      .desktop-heading-copy h1 { font-size: 2rem; }

      .desktop-heading-stat { flex: 0 0 auto; text-align: right; }
      .desktop-heading-stat span { display: block; color: #718078; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; }
      .desktop-heading-stat strong { display: block; margin-top: 0.15rem; color: #0b6146; font-size: 1.3rem; font-weight: 950; }

      .beta-main { padding: 1.25rem 2rem 3rem; }
      .beta-shell .panel-card { padding: 1.5rem !important; }
      .category-grid { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
      .category-grid button { min-height: 5.25rem; flex-direction: column !important; justify-content: center; text-align: center; }
      .category-grid button:last-child { grid-column: auto; }
      .consumer-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .beta-footer { padding-top: 0; }
    }

    @media (min-width: 75rem) {
      body { padding: 1.25rem; }
      .beta-shell { min-height: calc(100vh - 2.5rem); grid-template-columns: 24rem minmax(0, 1fr); border-radius: 1.6rem; overflow: clip; }
      .beta-rail { height: calc(100vh - 2.5rem); }
    }

    /* --- BETA V2: CARGA RÁPIDA --- */
    :root {
      --v2-pitch: #063d2d;
      --v2-pitch-dark: #03271d;
      --v2-green: #087a55;
      --v2-green-bright: #12a574;
      --v2-lime: #c6f36f;
      --v2-paper: #f3f6f2;
      --v2-card: #ffffff;
      --v2-ink: #10271e;
      --v2-muted: #65776d;
      --v2-line: #d8e4dc;
      --v2-danger: #c33f3f;
    }

    html { scroll-behavior: smooth; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      color: var(--v2-ink);
      background: var(--v2-pitch-dark);
    }

    body.drawer-open { overflow: hidden; }

    .quick-app {
      min-height: 100vh;
      background: var(--v2-paper);
    }

    .quick-header {
      position: relative;
      overflow: hidden;
      color: white;
      background:
        linear-gradient(100deg, rgba(3, 39, 29, 0.96), rgba(5, 72, 50, 0.78)),
        url('./assets/cancha-fondo.jpg') center 49% / cover;
      border-bottom: 4px solid var(--v2-lime);
    }

    .quick-header::after {
      position: absolute;
      right: -4.5rem;
      bottom: -8.5rem;
      width: 15rem;
      height: 15rem;
      content: '';
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 50%;
      box-shadow: 0 0 0 2.3rem rgba(255, 255, 255, 0.035);
      pointer-events: none;
    }

    .quick-header-inner {
      position: relative;
      z-index: 1;
      display: grid;
      width: min(100%, 75rem);
      margin: 0 auto;
      gap: 1rem;
      padding: max(1rem, env(safe-area-inset-top)) 1rem 1rem;
    }

    .quick-brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .quick-brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 0.75rem;
    }

    .quick-logo {
      width: 3.2rem;
      height: 3.2rem;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 1rem;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
    }

    .quick-brand-copy { min-width: 0; }

    .quick-brand-copy strong {
      display: block;
      overflow: hidden;
      font-size: 1.1rem;
      font-weight: 950;
      letter-spacing: -0.025em;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quick-brand-copy span {
      display: inline-flex;
      margin-top: 0.25rem;
      padding: 0.18rem 0.5rem;
      color: #082e22;
      background: var(--v2-lime);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .icon-button {
      display: inline-grid;
      width: 2.9rem;
      height: 2.9rem;
      flex: 0 0 auto;
      place-items: center;
      color: inherit;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 0.9rem;
    }

    .match-strip {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
    }

    .match-stat {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.75rem 0.85rem;
      background: rgba(255, 255, 255, 0.11);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 0.9rem;
      backdrop-filter: blur(8px);
    }

    .match-stat span { color: rgba(255, 255, 255, 0.7); font-size: 0.8125rem; font-weight: 750; }
    .match-stat strong { color: white; font-size: 1rem; font-weight: 950; }

    .quick-layout {
      display: grid;
      width: min(100%, 75rem);
      margin: 0 auto;
      gap: 1rem;
      padding: 1rem 1rem 7rem;
    }

    .quick-column { display: grid; min-width: 0; align-content: start; gap: 1rem; }

    .quick-card {
      min-width: 0;
      padding: 1.1rem;
      background: var(--v2-card);
      border: 1px solid var(--v2-line);
      border-radius: 1.25rem;
      box-shadow: 0 12px 32px rgba(4, 48, 34, 0.07);
    }

    .quick-section-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .quick-section-heading h1,
    .quick-section-heading h2,
    .settlement-heading h2 {
      margin: 0;
      color: var(--v2-ink);
      font-size: 1.25rem;
      font-weight: 950;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .quick-section-heading p,
    .settlement-heading p {
      margin: 0.3rem 0 0;
      color: var(--v2-muted);
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.45;
    }

    .count-badge {
      flex: 0 0 auto;
      padding: 0.35rem 0.65rem;
      color: #0b684a;
      background: #e7f5ec;
      border: 1px solid #cce5d5;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 900;
    }

    .add-team-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.55rem;
    }

    .quick-app input,
    .quick-app select {
      width: 100%;
      min-height: 3.35rem;
      color: var(--v2-ink);
      background: #f7faf7;
      border: 1px solid #cad8cf;
      border-radius: 0.9rem;
      outline: none;
    }

    .quick-app input { padding: 0.8rem 0.95rem; }
    .quick-app select { padding: 0.8rem 2.4rem 0.8rem 0.9rem; }

    .quick-app input:focus,
    .quick-app select:focus,
    .quick-app button:focus-visible,
    .quick-app a:focus-visible {
      border-color: var(--v2-green);
      box-shadow: 0 0 0 4px rgba(8, 122, 85, 0.15);
      outline: none;
    }

    .quick-app input::placeholder { color: #87968e; }

    .primary-button,
    .secondary-button,
    .ghost-button,
    .danger-link {
      display: inline-flex;
      min-height: 3.25rem;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.75rem 1rem;
      border-radius: 0.9rem;
      font-size: 0.95rem;
      font-weight: 900;
      line-height: 1.2;
      transition: transform 150ms ease, background 150ms ease, border 150ms ease;
    }

    .primary-button {
      color: white;
      background: linear-gradient(145deg, var(--v2-green-bright), #086849);
      border: 1px solid transparent;
      box-shadow: 0 10px 22px rgba(8, 122, 85, 0.2);
    }

    .secondary-button {
      color: #124334;
      background: #edf5f0;
      border: 1px solid #cadcd1;
    }

    .ghost-button {
      min-height: 2.65rem;
      padding: 0.55rem 0.75rem;
      color: #426054;
      background: white;
      border: 1px solid var(--v2-line);
    }

    .danger-link {
      min-height: 2.65rem;
      padding: 0.5rem 0.7rem;
      color: var(--v2-danger);
      background: #fff5f5;
      border: 1px solid #f0d2d2;
    }

    .primary-button:active,
    .secondary-button:active,
    .ghost-button:active { transform: scale(0.98); }

    .primary-button:disabled,
    .secondary-button:disabled { cursor: not-allowed; opacity: 0.45; box-shadow: none; }

    .team-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.9rem;
    }

    .player-chip {
      display: inline-flex;
      min-height: 2.75rem;
      align-items: center;
      gap: 0.55rem;
      padding: 0.35rem 0.45rem 0.35rem 0.4rem;
      color: #163a2d;
      background: #eef5f0;
      border: 1px solid #d4e1d8;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 850;
    }

    .player-initial {
      display: grid;
      width: 2rem;
      height: 2rem;
      flex: 0 0 auto;
      place-items: center;
      color: white;
      background: linear-gradient(145deg, #16a273, #075b42);
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: 950;
    }

    .chip-remove {
      display: grid;
      width: 2rem;
      height: 2rem;
      place-items: center;
      color: #6a7a72;
      background: transparent;
      border: 0;
      border-radius: 50%;
    }

    .chip-remove svg { width: 0.9rem; height: 0.9rem; }

    .team-help {
      margin: 0.7rem 0 0;
      color: var(--v2-muted);
      font-size: 0.8125rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .empty-inline {
      margin-top: 0.9rem;
      padding: 1rem;
      color: #687a70;
      text-align: center;
      background: #f4f7f4;
      border: 1px dashed #cbd9d0;
      border-radius: 0.9rem;
      font-size: 0.9rem;
      font-weight: 700;

    .composer-disabled { opacity: 0.55; pointer-events: none; }

    .concept-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
    }

    .concept-button {
      display: flex;
      min-height: 3.5rem;
      align-items: center;
      gap: 0.55rem;
      padding: 0.7rem 0.8rem;
      color: #587066;
      text-align: left;
      background: #f6f9f6;
      border: 1px solid #d9e3dc;
      border-radius: 0.9rem;
      font-size: 0.9rem;
      font-weight: 850;
    }

    .concept-button.is-selected {
      color: white;
      background: #0a6448;
      border-color: #0a6448;
      box-shadow: 0 8px 18px rgba(6, 75, 52, 0.18);

    .concept-icon {
      display: grid;
      width: 2rem;
      height: 2rem;
      flex: 0 0 auto;
      place-items: center;
      color: #087a55;
      background: white;
      border: 1px solid rgba(8, 122, 85, 0.12);
      border-radius: 0.65rem;
    }

    .field-grid { display: grid; gap: 0.75rem; margin-top: 0.9rem; }

    .field-group { display: grid; gap: 0.4rem; }
    .field-group label { color: #3f5b4f; font-size: 0.875rem; font-weight: 850; }
    .amount-field { color: #075f44 !important; font-size: 1.25rem !important; font-weight: 950 !important; }

    .split-toggle {
      display: flex;
      width: 100%;
      min-height: 3.4rem;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 0.85rem;
      padding: 0.75rem 0.85rem;
      color: #26493b;
      text-align: left;
      background: #eef6f1;
      border: 1px solid #d0e2d7;
      border-radius: 0.9rem;
      font-size: 0.9rem;
      font-weight: 850;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      margin-top: 0.7rem;
      padding: 0.65rem;

      border: 1px solid #d7e2da;
      border-radius: 0.95rem;

    .consumer-button {
      display: flex;
      min-width: 0;
      min-height: 3rem;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 0.7rem;
      color: #66786e;
      text-align: left;
      background: white;
      border: 1px solid #dce5df;
      border-radius: 0.75rem;
      font-size: 0.85rem;
      font-weight: 800;

    .consumer-button.is-selected { color: #0a5f44; border-color: #7dc5a8; box-shadow: inset 0 0 0 1px #7dc5a8; }
    .consumer-check { display: grid; width: 1.25rem; height: 1.25rem; flex: 0 0 auto; place-items: center; border: 1px solid #b7c8be; border-radius: 0.38rem; }

    .composer-actions { display: grid; gap: 0.55rem; margin-top: 0.9rem; }

    .expense-list { display: grid; gap: 0.65rem; }

    .expense-row-v2 {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem;
      background: #f6f9f7;
      border: 1px solid #dce5df;
      border-radius: 1rem;
    }

    .expense-row-icon {
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      place-items: center;
      color: #087a55;
      background: white;
      border: 1px solid #dce6df;
      border-radius: 0.8rem;
    }

    .expense-row-copy { min-width: 0; }
    .expense-row-copy strong { display: block; overflow: hidden; color: #153329; font-size: 0.95rem; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
    .expense-row-copy span { display: block; margin-top: 0.18rem; color: #6a7a72; font-size: 0.8125rem; font-weight: 650; line-height: 1.35; }

    .expense-row-end { text-align: right; }
    .expense-row-end strong { display: block; color: #075f44; font-size: 1rem; font-weight: 950; }

    .expense-empty {
      padding: 1.5rem 1rem;
      color: #6c7e74;
      text-align: center;
      background: #f5f8f6;
      border: 1px dashed #cddbd2;
      border-radius: 1rem;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .mobile-settle-button {
      position: fixed;
      right: 1rem;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      left: 1rem;
      z-index: 45;
      display: flex;
      min-height: 3.65rem;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 0.85rem 0.7rem 1rem;
      color: white;
      background: linear-gradient(145deg, #0b7452, #044630);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 1rem;
      box-shadow: 0 16px 36px rgba(2, 42, 29, 0.32);
    }

    .mobile-settle-button:disabled { opacity: 0.55; }
    .mobile-settle-copy { text-align: left; }
    .mobile-settle-copy span { display: block; color: var(--v2-lime); font-size: 0.75rem; font-weight: 850; }
    .mobile-settle-copy strong { display: block; margin-top: 0.1rem; font-size: 1rem; font-weight: 950; }
    .mobile-settle-pill { padding: 0.45rem 0.65rem; color: #083324; background: var(--v2-lime); border-radius: 0.7rem; font-size: 0.85rem; font-weight: 950; }

    .settlement-drawer {
      position: fixed;
      z-index: 70;
      visibility: hidden;
      opacity: 0;
      inset: 0;
      transition: visibility 180ms ease, opacity 180ms ease;
    }

    .settlement-drawer.is-open { visibility: visible; opacity: 1; }

    .settlement-backdrop {
      position: absolute;
      background: rgba(2, 25, 18, 0.64);
      backdrop-filter: blur(3px);
      inset: 0;
    }

    .settlement-panel {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      max-height: min(90vh, 52rem);
      overflow-y: auto;
      padding: 0.8rem 1rem calc(1.25rem + env(safe-area-inset-bottom));
      background: white;
      border-radius: 1.5rem 1.5rem 0 0;
      box-shadow: 0 -20px 60px rgba(2, 35, 24, 0.25);
      transform: translateY(2rem);
      transition: transform 180ms ease;
    }

    .settlement-drawer.is-open .settlement-panel { transform: translateY(0); }

    .drawer-handle { width: 3rem; height: 0.3rem; margin: 0 auto 0.85rem; background: #cad7cf; border-radius: 999px; }

    .settlement-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }

    .drawer-close {
      display: grid;
      width: 2.7rem;
      height: 2.7rem;
      flex: 0 0 auto;
      place-items: center;
      color: #4f665b;
      background: #f0f5f2;
      border: 1px solid #d8e3dc;
      border-radius: 0.8rem;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
      margin-top: 1rem;
      padding: 0.7rem;
      color: white;
      background: linear-gradient(145deg, #0a6548, #043727);
      border-radius: 1rem;
    }

    .score-cell { min-width: 0; padding: 0.45rem 0.35rem; text-align: center; border-right: 1px solid rgba(255, 255, 255, 0.13); }
    .score-cell:last-child { border-right: 0; }
    .score-cell span { display: block; color: rgba(255, 255, 255, 0.65); font-size: 0.7rem; font-weight: 850; letter-spacing: 0.04em; text-transform: uppercase; }
    .score-cell strong { display: block; overflow: hidden; margin-top: 0.2rem; color: white; font-size: 0.95rem; font-weight: 950; text-overflow: ellipsis; }

    .settlement-list { display: grid; gap: 0.65rem; margin-top: 1rem; }

    .transfer-row-v2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 0.55rem;
      padding: 0.85rem;
      background: #f3f8f5;
      border: 1px solid #d4e3d9;
      border-left: 4px solid var(--v2-green-bright);
      border-radius: 0.9rem;
    }

    .transfer-person { min-width: 0; }
    .transfer-person:last-child { text-align: right; }

    @keyframes live-pulse {

      35% { box-shadow: 0 0 0 0.4rem rgba(198, 243, 111, 0); }
    }
  </style>

<body class="min-h-screen font-sans antialiased selection:bg-emerald-200">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    // --- ICONOS SVG ---
    const IconUsers = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;

    const IconBeer = () => <svg className="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M9 12v6"/><path d="M13 12v6"/><path d="M14 7.5a2.5 2.5 0 0 0-5 0M4 11h13v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V11z"/></svg>;

    const IconFood = () => <svg className="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
    const IconCoins = () => <svg className="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="8" cy="8" r="6"/><circle cx="18" cy="18" r="4"/><path d="M12 18a6 6 0 0 0-6-6"/></svg>;
    const IconChevronDown = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>;
    const IconChevronUp = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>;
    const IconChevronRight = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>;
    const IconShare = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>;
    const IconCopy = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
    const IconDownload = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IconReceipt = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><path d="M6 8h12"/><path d="M6 12h12"/><path d="M6 16h8"/></svg>;
    const IconBank = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v8"/><path d="M20 8v8"/><path d="M8 8v8"/><path d="M16 8v8"/><rect width="20" height="5" x="2" y="16" rx="1"/></svg>;
    const IconArrowLeft = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h10"/></svg>;

    const loadStoredList = (key) => {
      try {
        const value = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    };

    const saveStoredList = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        // La aplicación sigue funcionando aunque el navegador bloquee el almacenamiento.
      }
    };

    const loadPreferredList = (key, fallbackKey) => {
      try {
        if (localStorage.getItem(key) !== null) return loadStoredList(key);
      } catch {
        // Si el navegador bloquea el almacenamiento, se usa la lista anterior.
      }
      return loadStoredList(fallbackKey);
    };

    function App() {
      // --- ESTADOS Y PERSISTENCIA (Local Storage) ---
      const [players, setPlayers] = useState(() => loadPreferredList('tt_v2_players', 'tt_players'));
      
      const [expenses, setExpenses] = useState(() => loadPreferredList('tt_v2_expenses', 'tt_expenses'));

      useEffect(() => {
        saveStoredList('tt_v2_players', players);
      }, [players]);

      useEffect(() => {
        saveStoredList('tt_v2_expenses', expenses);
      }, [expenses]);

      // --- ESTADOS DE FORMULARIOS ---
      const [newPlayerName, setNewPlayerName] = useState('');
      
      const [expenseDesc, setExpenseDesc] = useState('Cancha ⚽');
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expensePayer, setExpensePayer] = useState('');
      const [expenseConsumers, setExpenseConsumers] = useState([]);
      const [expenseCategory, setExpenseCategory] = useState('court');
      
      const [toast, setToast] = useState(null);
      const [showSplitOptions, setShowSplitOptions] = useState(false);
      const [editingExpenseId, setEditingExpenseId] = useState(null);
      const [isSettlementOpen, setIsSettlementOpen] = useState(false);

      const canvasRef = useRef(null);

      useEffect(() => {
        document.body.classList.toggle('drawer-open', isSettlementOpen);
        return () => document.body.classList.remove('drawer-open');
      }, [isSettlementOpen]);

      useEffect(() => {
        if (players.length > 0 && !players.some(player => player.id === expensePayer)) {
          setExpensePayer(players[0].id);
        }
      }, [players, expensePayer]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const resetExpenseForm = () => {
        setExpenseDesc('Cancha ⚽');
        setExpenseAmount('');
        setExpenseCategory('court');
        setExpenseConsumers(players.map(p => p.id));
        setShowSplitOptions(false);
        setEditingExpenseId(null);
      };

      const handleNewMatch = () => {
        if (expenses.length > 0 && !window.confirm('¿Empezar un partido nuevo? Se borrarán los gastos actuales, pero el equipo y los alias quedarán guardados.')) return;
        setExpenses([]);
        resetExpenseForm();
        setIsSettlementOpen(false);
        showToast('Partido nuevo listo. El equipo quedó guardado.', 'info');
      };

      const clearRoster = () => {
        if(window.confirm('¿Vaciar el equipo? También se borrarán los gastos de este partido.')){
          setPlayers([]);
          setExpenses([]);
          setExpenseDesc('');
          setExpenseAmount('');
          setExpensePayer('');
          setExpenseConsumers([]);
          setEditingExpenseId(null);
          setShowSplitOptions(false);
          setIsSettlementOpen(false);
          showToast('Equipo vacío. Podés armar uno nuevo.', 'info');
        }
      };

      // --- JUGADORES ---
      const handleAddPlayer = (e) => {
        e.preventDefault();
        if (!newPlayerName.trim()) return;

        const names = newPlayerName
          .split(/[,;\n]+/)
          .map(name => name.trim())
          .filter(Boolean);
        const existingNames = new Set(players.map(player => player.name.toLocaleLowerCase('es-AR')));
        const uniqueNames = names.filter((name, index) => {
          const normalized = name.toLocaleLowerCase('es-AR');
          return !existingNames.has(normalized) && names.findIndex(item => item.toLocaleLowerCase('es-AR') === normalized) === index;
        });

        if (uniqueNames.length === 0) {
          showToast('Esos nombres ya están en el equipo', 'info');
          return;
        }

        const createdAt = Date.now();
        const newPlayers = uniqueNames.map((name, index) => ({
          id: `p_${createdAt}_${index}`,
          name,
          alias: ''
        }));

        setPlayers([...players, ...newPlayers]);
        setNewPlayerName('');

        if (players.length === 0) setExpensePayer(newPlayers[0].id);
        setExpenseConsumers(prev => [...prev, ...newPlayers.map(player => player.id)]);
        showToast(newPlayers.length === 1 ? `${newPlayers[0].name} se sumó al equipo` : `${newPlayers.length} jugadores agregados`);
      };

      const handleDeletePlayer = (id) => {
        const playerToDelete = players.find(p => p.id === id);
        setPlayers(players.filter(p => p.id !== id));
        setExpenses(expenses.filter(e => e.paidById !== id).map(e => ({
          ...e, consumerIds: e.consumerIds.filter(cid => cid !== id)
        })).filter(e => e.consumerIds.length > 0));
        setExpenseConsumers(current => current.filter(playerId => playerId !== id));
        if (expensePayer === id) setExpensePayer(players.find(player => player.id !== id)?.id || '');
        showToast(`${playerToDelete?.name} eliminado`);
      };

      const handleUpdateAlias = (id, newAlias) => {
        setPlayers(players.map(p => p.id === id ? { ...p, alias: newAlias } : p));
      };

      // --- LÓGICA DE DIVISIÓN ---
      const toggleFormConsumer = (id) => {
        if (expenseConsumers.includes(id)) {
          setExpenseConsumers(expenseConsumers.filter(cid => cid !== id));
        } else {
          setExpenseConsumers([...expenseConsumers, id]);
        }
      };

      const toggleAllConsumers = () => {
        if (expenseConsumers.length === players.length) setExpenseConsumers([]);
        else setExpenseConsumers(players.map(p => p.id));
      };

      const handleAddExpense = (e) => {
        e.preventDefault();
        if (!expenseDesc.trim()) { showToast('Contanos qué se pagó', 'error'); return; }
        const amount = parseFloat(expenseAmount);
        if (isNaN(amount) || amount <= 0) { showToast('El monto debe ser un número mayor a 0', 'error'); return; }
        if (!expensePayer) { showToast('Debe haber alguien que pague el gasto', 'error'); return; }
        const consumers = showSplitOptions ? expenseConsumers : players.map(player => player.id);
        if (consumers.length === 0) { showToast('Elegí al menos una persona para dividir el gasto', 'error'); return; }

        const newExpense = {
          id: editingExpenseId || `e_${Date.now()}`, description: expenseDesc.trim(), amount,
          paidById: expensePayer, consumerIds: [...consumers], category: expenseCategory
        };

        if (editingExpenseId) {
          setExpenses(expenses.map(expense => expense.id === editingExpenseId ? newExpense : expense));
          showToast('Gasto actualizado');
        } else {
          setExpenses([...expenses, newExpense]);
          showToast('Gasto guardado');
        }
        resetExpenseForm();
      };

      const handleEditExpense = (expense) => {
        setEditingExpenseId(expense.id);
        setExpenseDesc(expense.description);
        setExpenseAmount(String(expense.amount));
        setExpensePayer(expense.paidById);
        setExpenseConsumers([...expense.consumerIds]);
        setExpenseCategory(expense.category || 'other');
        setShowSplitOptions(expense.consumerIds.length !== players.length);
        document.getElementById('quick-expense-form')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      const cancelExpenseEdit = () => {
        resetExpenseForm();
        showToast('Edición cancelada', 'info');
      };

      const handleDeleteExpense = (id) => {
        setExpenses(expenses.filter(e => e.id !== id));
        if (editingExpenseId === id) resetExpenseForm();
        showToast('Gasto eliminado', 'info');
      };

      const roundUpToCentena = (val) => Math.ceil(val / 100) * 100;

      const calculations = useMemo(() => {
        const balances = {}; const individualSpending = {}; const individualPaid = {}; const playerUsageDetails = {};

        players.forEach(p => {
          balances[p.id] = 0; individualSpending[p.id] = 0; individualPaid[p.id] = 0; playerUsageDetails[p.id] = [];
        });

        expenses.forEach(exp => {
          const { amount, paidById, consumerIds, description } = exp;
          if (players.some(p => p.id === paidById)) {
            balances[paidById] += amount; individualPaid[paidById] += amount;
          }
          const share = amount / consumerIds.length;
          consumerIds.forEach(cid => {
            if (balances[cid] !== undefined) {
              balances[cid] -= share; individualSpending[cid] += share;
              playerUsageDetails[cid].push({ description, totalAmount: amount, consumersCount: consumerIds.length, yourShare: share });
            }
          });
        });

        const totalSpent = expenses.reduce((sum, e) => sum + e.amount, 0);

        let debtors = []; let creditors = [];
        Object.keys(balances).forEach(id => {
          const balance = balances[id];
          const player = players.find(p => p.id === id);
          if (!player) return;
          if (balance < -0.01) debtors.push({ id, name: player.name, balance: Math.abs(balance) });
          else if (balance > 0.01) creditors.push({ id, name: player.name, balance });
        });

        debtors.sort((a, b) => b.balance - a.balance);
        creditors.sort((a, b) => b.balance - a.balance);

        const transactions = [];
        let i = 0; let j = 0;

        while (i < debtors.length && j < creditors.length) {
          const debtor = debtors[i];
          const creditor = creditors[j];
          const payment = Math.min(debtor.balance, creditor.balance);
          
          const creditorPlayer = players.find(p => p.id === creditor.id);

          transactions.push({
            fromId: debtor.id,
            from: debtor.name,
            toId: creditor.id,
            to: creditor.name,
            toAlias: creditorPlayer?.alias || '',
            amountExact: payment,
            amountRounded: roundUpToCentena(payment) 
          });

          debtor.balance -= payment; creditor.balance -= payment;
          if (debtor.balance < 0.01) i++;
          if (creditor.balance < 0.01) j++;
        }

        return { balances, individualSpending, individualPaid, playerUsageDetails, totalSpent, transactions };
      }, [players, expenses]);

      const categories = {
        court: { icon: <IconDollar />, label: 'Cancha' }, drinks: { icon: <IconBeer />, label: 'Bebidas' },
        ice: { icon: <IconWater />, label: 'Hielo' },
        beer: { icon: <IconBeer />, label: 'Cerveza' }, water: { icon: <IconWater />, label: 'Agua' },
        soda: { icon: <IconSoda />, label: 'Gaseosa' }, food: { icon: <IconFood />, label: 'Comida' },
        other: { icon: <IconCoins />, label: 'Otro' }
      };

      const quickConcepts = [
        { category: 'court', label: 'Cancha', description: 'Cancha ⚽', icon: <IconDollar /> },
        { category: 'drinks', label: 'Bebidas', description: 'Bebidas 🍻', icon: <IconBeer /> },
        { category: 'food', label: 'Comida', description: 'Comida 🍕', icon: <IconFood /> },
        { category: 'other', label: 'Otro', description: '', icon: <IconCoins /> }
      ];

      const creditorsToPay = players.filter(player => calculations.transactions.some(transaction => transaction.toId === player.id));

      // --- COMPARTIR Y EXPORTAR ---
      const getRawTextResult = () => {
        if (expenses.length === 0) return '';
        let text = `⚽ *TERCER TIEMPO FMSC - LIQUIDACIÓN* 🍻\n`;
        text += `━━━━━━━━━━━━━━━━━━━━━\n`;
        text += `💰 *Gasto Total:* $${calculations.totalSpent.toLocaleString('es-AR')}\n`;
        text += `👥 *Integrantes:* ${players.length}\n\n`;
        text += `👉 *¿QUIÉN LE PAGA A QUIÉN?*\n\n`;
        
        if (calculations.transactions.length === 0) {
          text += `✅ *Las cuentas ya están equilibradas.*\n`;
        } else {
          calculations.transactions.forEach((t) => {
            text += `🔴 *${t.from}* paga a *${t.to}*${t.toAlias ? ` (Alias: ${t.toAlias})` : ''}\n`;
            text += `💵 *$${t.amountRounded.toLocaleString('es-AR')}*\n`;
            text += `(Monto exacto sin redondeo: $${Math.round(t.amountExact).toLocaleString('es-AR')})\n`;
            text += `━━━━━━━━━━━━━━━━━━━━━\n`;
          });
        }
        
        text += `\nGenerado con ⚽ *Tercer Tiempo FMSC* & LeaRama Dev 📱`;
        return text;
      };

      const handleShareWhatsAppText = () => {
        const rawText = getRawTextResult();
        if (!rawText) { showToast('No hay transacciones para compartir', 'error'); return; }
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'SHARE_TEXT', payload: rawText }));
        } else {
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(rawText)}`, '_blank', 'noopener,noreferrer');
        }
      };

      const handleCopyText = () => {
        const rawText = getRawTextResult();
        if (!rawText) { showToast('No hay transacciones para copiar', 'error'); return; }
        navigator.clipboard.writeText(rawText).then(() => showToast('¡Texto copiado al portapapeles! Listo para enviar.')).catch(() => showToast('Error al copiar el texto', 'error'));
      };

      const handleGenerateAndDownloadReceipt = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = 600; const itemHeight = 100; const headerHeight = 160; const footerHeight = 100;
        const calculatedHeight = headerHeight + (calculations.transactions.length * itemHeight) + footerHeight;
        
        canvas.width = width; canvas.height = calculatedHeight;

        // Fondo claro
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, calculatedHeight);
        ctx.fillStyle = '#059669'; ctx.fillRect(0, 0, width, 15); // Borde top

        ctx.fillStyle = '#111827'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('⚽ TERCER TIEMPO FMSC - PAGOS ⚽', width / 2, 55);

        ctx.fillStyle = '#4b5563'; ctx.font = '16px sans-serif';
        ctx.fillText(`Gasto Total: $${calculations.totalSpent.toLocaleString('es-AR')} | ${players.length} Integrantes`, width / 2, 85);
        ctx.fillStyle = '#059669'; ctx.font = 'italic 13px sans-serif';
        ctx.fillText('Nota: Los montos sugeridos están redondeados a la centena', width / 2, 110);

        ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(40, 130); ctx.lineTo(width - 40, 130); ctx.stroke();

        let currentY = headerHeight;
        calculations.transactions.forEach((t) => {
          ctx.fillStyle = '#f8fafc'; ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(30, currentY - 10, width - 60, itemHeight - 15, 12);
          else ctx.rect(30, currentY - 10, width - 60, itemHeight - 15);
          ctx.fill();
          ctx.strokeStyle = '#e2e8f0'; ctx.stroke();

          ctx.fillStyle = '#ef4444'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
          ctx.fillText(t.from, 50, currentY + 22);
          ctx.fillStyle = '#6b7280'; ctx.font = '11px sans-serif'; ctx.fillText('Debe transferir', 50, currentY + 40);

          ctx.fillStyle = '#9ca3af'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('➔', width / 2 - 10, currentY + 25);
          ctx.fillStyle = '#059669'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(`$${t.amountRounded.toLocaleString('es-AR')}`, width / 2 - 10, currentY + 50);

          ctx.fillStyle = '#10b981'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'right';
          ctx.fillText(t.to, width - 50, currentY + 22);
          
          ctx.fillStyle = '#6b7280'; ctx.font = '11px sans-serif';
          ctx.fillText(t.toAlias ? `Alias: ${t.toAlias}` : 'Efectivo/Sin Alias', width - 50, currentY + 40);
          
          currentY += itemHeight;
        });

        ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(40, currentY - 10); ctx.lineTo(width - 40, currentY - 10); ctx.stroke();

        ctx.fillStyle = '#6b7280'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Generado gratis con Tercer Tiempo FMSC', width / 2, currentY + 25);
        ctx.font = 'bold 12px sans-serif'; ctx.fillText('¡Evitemos las deudas y disfrutemos del fútbol! ⚽', width / 2, currentY + 45);

        const imageURI = canvas.toDataURL('image/png');
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'DOWNLOAD_IMAGE', payload: imageURI }));
        } else {
          const link = document.createElement('a'); link.download = `liquidacion-${Date.now()}.png`; link.href = imageURI;
          document.body.appendChild(link); link.click(); document.body.removeChild(link);
          showToast('¡Imagen guardada! Ya podés compartirla.');
        }
      };

      const selectQuickConcept = (concept) => {
        setExpenseCategory(concept.category);
        setExpenseDesc(concept.description);
        if (!concept.description) {
          window.setTimeout(() => document.getElementById('expense-description')?.focus(), 0);
        }
      };

      const toggleSplitOptions = () => {
        if (!showSplitOptions && expenseConsumers.length === 0) {
          setExpenseConsumers(players.map(player => player.id));
        }
        setShowSplitOptions(!showSplitOptions);
      };

      const openSettlement = () => {
        if (expenses.length === 0) {
          showToast('Primero guardá al menos un gasto', 'error');
          return;
        }
        setIsSettlementOpen(true);
      };

      return (
        <div className="quick-app">
          {toast && (
            <div className={`app-toast-v2 ${toast.type === 'error' ? 'is-error' : toast.type === 'info' ? 'is-info' : ''}`} role="status">
              <IconAlert />
              <span>{toast.message}</span>
            </div>
          )}

          <header className="quick-header">
            <div className="quick-header-inner">
              <div className="quick-brand-row">
                <div className="quick-brand">
                  <img className="quick-logo" src="./icon.svg" alt="" aria-hidden="true" />
                  <div className="quick-brand-copy">
                    <strong>Tercer Tiempo FMSC</strong>
                    <span><i className="live-dot" aria-hidden="true"></i> Partido en curso</span>
                    <small>Fútbol · amigos · cuentas claras</small>
                  </div>
                </div>
                <a className="icon-button" href="../" aria-label="Volver al portal de Lea Rama Dev">
                  <IconArrowLeft />
                </a>
              </div>

              <div className="match-strip" aria-label="Resumen del partido">
                <div className="match-stat"><span>Juegan</span><strong>{players.length}</strong></div>
                <div className="match-stat"><span>Gastos</span><strong>{expenses.length}</strong></div>
                <div className="match-stat is-highlighted"><span>Total</span><strong>${calculations.totalSpent.toLocaleString('es-AR')}</strong></div>
              </div>
            </div>
          </header>

          <main className="quick-layout">
            <div className="quick-column">
              <section className="quick-card team-card" aria-labelledby="team-title">
                <div className="quick-section-heading">
                  <div>
                    <span className="section-kicker">01 · Equipo</span>
                    <h1 id="team-title">¿Quiénes jugaron?</h1>
                    <p>Podés escribir varios nombres separados por comas.</p>
                  </div>
                  <span className="count-badge">{players.length}</span>
                </div>

                <form className="add-team-form" onSubmit={handleAddPlayer}>
                  <input
                    type="text"
                    value={newPlayerName}
                    onChange={(event) => setNewPlayerName(event.target.value)}
                    placeholder="Mati, Lucho, Nico..."
                    aria-label="Nombres de los jugadores"
                  />
                  <button className="primary-button" type="submit"><IconPlus /> Sumar</button>
                </form>

                {players.length === 0 ? (
                  <div className="empty-inline">Sumá el equipo para empezar a cargar los gastos.</div>
                ) : (
                  <>
                    <div className="team-list" aria-label="Equipo actual">
                      {players.map((player, index) => (
                        <div className="player-chip" key={player.id}>
                          <span className="player-initial" style={{ '--player-hue': (index * 47) % 150 }} aria-hidden="true">{player.name.trim().charAt(0).toUpperCase()}</span>
                          <span>{player.name}</span>
                          <button className="chip-remove" type="button" onClick={() => handleDeletePlayer(player.id)} aria-label={`Quitar a ${player.name}`}>
                            <IconTrash />
                          </button>
                        </div>
                      ))}
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', gap: '0.5rem', marginTop: '0.85rem', flexWrap: 'wrap' }}>
                      <button className="new-match-button" type="button" onClick={handleNewMatch}><IconPlus /> Nuevo partido</button>
                      <button className="danger-link" type="button" onClick={clearRoster}>Cambiar todo el equipo</button>
                    </div>
                  </>
                )}
              </section>

              <section id="quick-expense-form" className={`quick-card composer-card ${players.length === 0 ? 'composer-disabled' : ''}`} aria-labelledby="expense-title">
                <div className="quick-section-heading">
                  <div>
                    <span className="section-kicker">02 · Gastos</span>
                    <h2 id="expense-title">¿Qué se pagó?</h2>
                    <p>Elegí un concepto, quién pagó y el monto.</p>
                  </div>
                  {editingExpenseId && <span className="count-badge">Editando</span>}
                </div>

                <form onSubmit={handleAddExpense}>
                  <div className="concept-grid" aria-label="Conceptos rápidos">
                    {quickConcepts.map(concept => (
                      <button
                        key={concept.category}
                        className={`concept-button concept-${concept.category} ${expenseCategory === concept.category ? 'is-selected' : ''}`}
                        type="button"
                        onClick={() => selectQuickConcept(concept)}
                      >
                        <span className="concept-icon">{concept.icon}</span>
                        <span>{concept.label}</span>
                      </button>
                    ))}
                  </div>

                  <div className="field-group" style={{ marginTop: '0.9rem' }}>
                    <label htmlFor="expense-description">Detalle</label>
                    <input
                      id="expense-description"
                      type="text"
                      value={expenseDesc}
                      onChange={(event) => setExpenseDesc(event.target.value)}
                      placeholder="Ej. Cancha, bebidas o comida"
                    />
                  </div>

                  <div className="field-grid">
                    <div className="field-group">
                      <label htmlFor="expense-payer">Pagó</label>
                      <select id="expense-payer" value={expensePayer} onChange={(event) => setExpensePayer(event.target.value)}>
                        {players.map(player => <option key={player.id} value={player.id}>{player.name}</option>)}
                      </select>
                    </div>
                    <div className="field-group">
                      <label htmlFor="expense-amount">Monto</label>
                      <input
                        id="expense-amount"
                        className="amount-field"
                        type="number"
                        inputMode="decimal"
                        min="0"
                        step="0.01"
                        value={expenseAmount}
                        onChange={(event) => setExpenseAmount(event.target.value)}
                        placeholder="$ 0"
                      />
                    </div>
                  </div>

                  <button className="split-toggle" type="button" onClick={toggleSplitOptions} aria-expanded={showSplitOptions}>
                    <span>{showSplitOptions ? 'Elegí quiénes participan' : 'Se divide entre todo el equipo'}</span>
                    <span>{showSplitOptions ? 'Ocultar' : 'Cambiar'}</span>
                  </button>

                  {showSplitOptions && (
                    <div className="consumer-picker" aria-label="Personas que participan del gasto">
                      {players.map(player => {
                        const isSelected = expenseConsumers.includes(player.id);
                        return (
                          <button
                            key={player.id}
                            className={`consumer-button ${isSelected ? 'is-selected' : ''}`}
                            type="button"
                            onClick={() => toggleFormConsumer(player.id)}
                            aria-pressed={isSelected}
                          >
                            <span>{player.name}</span>
                            <span className="consumer-check">{isSelected && <IconCheck />}</span>
                          </button>
                        );
                      })}
                    </div>
                  )}

                  <div className="composer-actions">
                    <button className="primary-button" type="submit">
                      {editingExpenseId ? <><IconCheck /> Guardar cambios</> : <><IconPlus /> Guardar gasto</>}
                    </button>
                    {editingExpenseId && <button className="secondary-button" type="button" onClick={cancelExpenseEdit}>Cancelar</button>}
                  </div>
                </form>
              </section>

              <section className="quick-card expenses-card" aria-labelledby="expense-list-title">
                <div className="quick-section-heading">
                  <div>
                    <span className="section-kicker">Movimientos</span>
                    <h2 id="expense-list-title">Gastos del partido</h2>
                    <p>{expenses.length === 0 ? 'Todavía no cargaste ninguno.' : 'Podés corregir cualquier gasto sin empezar de nuevo.'}</p>
                  </div>
                  <span className="count-badge">{expenses.length}</span>
                </div>

                {expenses.length === 0 ? (
                  <div className="expense-empty">El primer gasto aparecerá acá y las cuentas se calcularán automáticamente.</div>
                ) : (
                  <div className="expense-list">
                    {expenses.map(expense => {
                      const payer = players.find(player => player.id === expense.paidById);
                      const isEveryone = expense.consumerIds.length === players.length;
                      return (
                        <article className="expense-row-v2" data-category={expense.category} key={expense.id}>
                          <span className="expense-row-icon">{categories[expense.category]?.icon || <IconCoins />}</span>
                          <div className="expense-row-copy">
                            <strong>{expense.description}</strong>
                            <span>Pagó {payer?.name || 'Sin asignar'} · {isEveryone ? 'Entre todos' : `Entre ${expense.consumerIds.length}`}</span>
                          </div>
                          <div className="expense-row-end">
                            <strong>${expense.amount.toLocaleString('es-AR')}</strong>
                            <div className="expense-actions">
                              <button className="expense-action" type="button" onClick={() => handleEditExpense(expense)}>Editar</button>
                              <button className="expense-action is-danger" type="button" onClick={() => handleDeleteExpense(expense.id)}>Borrar</button>
                            </div>
                          </div>
                        </article>
                      );
                    })}
                  </div>
                )}
              </section>
            </div>

            <aside className={`settlement-drawer ${isSettlementOpen ? 'is-open' : ''}`} aria-label="Liquidación del partido">
              <button className="settlement-backdrop" type="button" onClick={() => setIsSettlementOpen(false)} aria-label="Cerrar liquidación"></button>
              <div className="settlement-panel">
                <div className="drawer-handle" aria-hidden="true"></div>
                <div className="settlement-heading">
                  <div>
                    <span className="section-kicker">Liquidación en vivo</span>
                    <h2>Así quedan las cuentas</h2>
                    <p>Resultado actualizado con cada gasto.</p>
                  </div>
                  <button className="drawer-close" type="button" onClick={() => setIsSettlementOpen(false)} aria-label="Cerrar">×</button>
                </div>

                <div className="scoreboard" aria-label="Totales">
                  <div className="score-cell"><span>Total</span><strong>${calculations.totalSpent.toLocaleString('es-AR')}</strong></div>
                  <div className="score-cell"><span>Equipo</span><strong>{players.length}</strong></div>
                  <div className="score-cell"><span>Pagos</span><strong>{calculations.transactions.length}</strong></div>
                </div>

                {expenses.length === 0 ? (
                  <div className="settlement-empty">Cargá un gasto y vas a ver inmediatamente quién le paga a quién.</div>
                ) : calculations.transactions.length === 0 ? (
                  <div className="settlement-empty">Las cuentas ya están equilibradas. Nadie tiene que transferir.</div>
                ) : (
                  <div className="settlement-list">
                    {calculations.transactions.map((transaction, index) => (
                      <div className="transfer-row-v2" key={`${transaction.fromId}-${transaction.toId}-${index}`}>
                        <div className="transfer-person"><span className="mini-avatar" aria-hidden="true">{transaction.from.trim().charAt(0).toUpperCase()}</span><span className="transfer-copy"><strong>{transaction.from}</strong><small>paga</small></span></div>
                        <div className="transfer-amount">${transaction.amountRounded.toLocaleString('es-AR')}<small>→</small></div>
                        <div className="transfer-person is-receiver"><span className="transfer-copy"><strong>{transaction.to}</strong><small>recibe</small></span><span className="mini-avatar is-receiver" aria-hidden="true">{transaction.to.trim().charAt(0).toUpperCase()}</span></div>
                      </div>
                    ))}
                  </div>
                )}

                {creditorsToPay.length > 0 && (
                  <div className="alias-section">
                    <h3>Alias para cobrar</h3>
                    <p>Solo aparecen quienes van a recibir una transferencia.</p>
                    {creditorsToPay.map(player => (
                      <div className="alias-field" key={player.id}>
                        <label htmlFor={`alias-${player.id}`}>{player.name}</label>
                        <input
                          id={`alias-${player.id}`}
                          type="text"
                          value={player.alias || ''}
                          onChange={(event) => handleUpdateAlias(player.id, event.target.value)}
                          placeholder="Alias, CBU o CVU"
                        />
                      </div>
                    ))}
                  </div>
                )}

                {expenses.length > 0 && (
                  <div className="share-actions">
                    <button className="primary-button whatsapp-button" type="button" onClick={handleShareWhatsAppText}><IconShare /> Enviar por WhatsApp</button>
                    <div className="share-actions-secondary">
                      <button className="secondary-button" type="button" onClick={handleCopyText}><IconCopy /> Copiar</button>
                      <button className="secondary-button" type="button" onClick={handleGenerateAndDownloadReceipt}><IconDownload /> Ticket</button>
                    </div>
                  </div>
                )}
              </div>
            </aside>
          </main>

          <button className="mobile-settle-button" type="button" onClick={openSettlement} disabled={expenses.length === 0}>
            <span className="mobile-settle-icon"><IconReceipt /></span>
            <span className="mobile-settle-copy"><span>Resultado en vivo</span><strong>Cerrar las cuentas</strong></span>
            <span className="mobile-settle-pill">{calculations.transactions.length} pagos</span>
          </button>

          <footer className="quick-footer">Tercer Tiempo FMSC · Beta v2 · Lea Rama Dev</footer>
          <canvas ref={canvasRef} hidden />
        </div>
      );

    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
