<html lang="es">

  <style>
    :root {
      --pitch-deep: #052e22;
      --pitch: #073f2e;
      --grass: #0f7a55;
      --lime: #b7e875;
      --cream: #f4f2e9;
      --surface: #fffefa;
      --ink: #12221b;
      --muted: #617168;
      --line: #dbe3dc;
      --shadow: 0 24px 70px rgba(5, 46, 34, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        radial-gradient(circle at top, #126447 0, var(--pitch-deep) 68%);
      background-size: 34px 34px, 34px 34px, auto;
      color: var(--ink);
      font-size: 16px;
    }

    button,
    input,
    select { font: inherit; }

    button,
    a { -webkit-tap-highlight-color: transparent; }

    .app-shell {
      position: relative;
      display: flex;
      min-height: 100vh;
      max-width: 42rem;
      margin: 0 auto;
      flex-direction: column;
      overflow: hidden;
      background: var(--cream);
      box-shadow: var(--shadow);
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 1rem 1.25rem 1.1rem;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(circle at 85% 10%, rgba(183, 232, 117, 0.24), transparent 32%),
        linear-gradient(135deg, var(--pitch-deep), var(--pitch) 72%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.13);
    }

    .app-header::after {
      position: absolute;
      right: -4.5rem;
      bottom: -7rem;
      width: 15rem;
      height: 15rem;
      content: '';
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      box-shadow: 0 0 0 2.5rem rgba(255, 255, 255, 0.035);
      pointer-events: none;
    }

    .app-header > * { position: relative; z-index: 1; }

    .brand-icon {
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      flex: 0 0 auto;
      place-items: center;
      color: var(--pitch-deep);
      background: var(--lime);
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 0.9rem;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    }

    .brand-kicker {
      margin: 0 0 0.12rem;
      color: var(--lime);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.13em;
      line-height: 1;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 0;
      color: white;
      font-size: clamp(1.05rem, 4.7vw, 1.3rem);
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }

    .brand-subtitle {
      margin-top: 0.25rem;
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .portal-back {
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      flex: 0 0 auto;
      place-items: center;
      color: white;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.9rem;
      transition: transform 160ms ease, background 160ms ease;
    }

    .portal-back:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateX(-2px);
    }

    .welcome-strip {
      display: grid;
      gap: 0.25rem;
      padding: 1rem 1.25rem 0.25rem;
    }

    .welcome-kicker {
      color: var(--pitch);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .welcome-strip p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.45;
    }

    .app-main {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 1.25rem;
      padding: 1rem 1.25rem 2rem;
      overflow-x: hidden;
    }

    .app-tabs {
      position: sticky;
      top: 4.95rem;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem;
      padding: 0.4rem;
      background: rgba(255, 254, 250, 0.94);
      border: 1px solid rgba(5, 46, 34, 0.11);
      border-radius: 1.2rem;
      box-shadow: 0 12px 30px rgba(5, 46, 34, 0.1);
      backdrop-filter: blur(14px);
    }

    .app-tab {
      display: flex;
      min-width: 0;
      min-height: 3.65rem;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.55rem 0.25rem;
      color: #718078;
      background: transparent;
      border: 0;
      border-radius: 0.9rem;
      font-size: 0.78rem;
      font-weight: 800;
      line-height: 1.1;
      transition: color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .app-tab:hover:not(:disabled) {
      color: var(--pitch);
      background: #eef4ed;
    }

    .app-tab.is-active {
      color: white;
      background: linear-gradient(145deg, var(--grass), var(--pitch));
      box-shadow: 0 8px 18px rgba(7, 63, 46, 0.23);
      transform: translateY(-1px);
    }

    .app-tab:disabled { cursor: not-allowed; opacity: 0.38; }

    .panel-card {
      background: var(--surface);
      border-color: rgba(5, 46, 34, 0.11) !important;
      border-radius: 1.35rem !important;
      box-shadow: 0 14px 34px rgba(5, 46, 34, 0.07) !important;
    }

    .app-shell h2 { font-size: 0.95rem; }

    .app-shell label { font-size: 0.8125rem; }

    .app-shell [class*="text-[9px]"],
    .app-shell [class*="text-[10px]"],
    .app-shell [class*="text-[11px]"] { font-size: 0.75rem; line-height: 1.35; }

    .app-shell input,
    .app-shell select {
      min-height: 3rem;
      font-size: 1rem;
      border-color: var(--line) !important;
    }

    .app-shell input:focus,
    .app-shell select:focus {
      border-color: var(--grass) !important;
      box-shadow: 0 0 0 4px rgba(15, 122, 85, 0.1);
    }

    .app-shell button.bg-emerald-600 {
      min-height: 3rem;
      background: linear-gradient(145deg, #149167, var(--grass));
      box-shadow: 0 10px 22px rgba(15, 122, 85, 0.2);
    }

    .app-shell button.bg-gray-900 {
      min-height: 3rem;
      background: linear-gradient(145deg, #173d31, var(--pitch-deep));
      box-shadow: 0 10px 22px rgba(5, 46, 34, 0.17);
    }

    .category-grid button { min-height: 4.25rem; font-size: 0.72rem; }

    .summary-stat {
      border-color: rgba(5, 46, 34, 0.11) !important;
      box-shadow: 0 10px 24px rgba(5, 46, 34, 0.07) !important;
    }

    .summary-stat:first-child {
      color: white;
      background: linear-gradient(145deg, var(--grass), var(--pitch));
    }

    .summary-stat:first-child span { color: white !important; }
    .summary-stat:first-child span:first-child { color: var(--lime) !important; }

    .app-toast {
      animation: toast-in 220ms ease-out both;
    }

    .app-footer {
      padding: 1rem 1.25rem calc(1rem + env(safe-area-inset-bottom));
      color: rgba(255, 255, 255, 0.72);
      text-align: center;
      background: var(--pitch-deep);
      border-top: 3px solid var(--lime);
    }

    .app-footer p { margin: 0; font-size: 0.76rem; font-weight: 800; letter-spacing: 0.04em; }

    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #9caaa1; border-radius: 9999px; }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .pb-safe { padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
      .mb-safe { margin-bottom: env(safe-area-inset-bottom); }
    }

    @media (min-width: 44rem) {
      body { padding: 1.5rem; }
      .app-shell { min-height: calc(100vh - 3rem); border-radius: 1.75rem; }
      .app-header { position: relative; }
      .app-tabs { top: 1rem; }
      .welcome-strip { padding-top: 1.25rem; }
    }

    @media (max-width: 25rem) {
      .app-header { padding-inline: 1rem; }
      .welcome-strip,
      .app-main { padding-inline: 0.9rem; }
      .app-tab { font-size: 0.72rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased selection:bg-emerald-200">

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    // --- ICONOS SVG ---
    const IconUsers = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const IconPlus = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;

    const IconDollar = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
    const IconCheck = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>;
    const IconSparkles = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
    const IconAlert = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
    const IconShuffle = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/></svg>;
    const IconBeer = () => <svg className="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M9 12v6"/><path d="M13 12v6"/><path d="M14 7.5a2.5 2.5 0 0 0-5 0M4 11h13v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V11z"/></svg>;
    const IconWater = () => <svg className="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-4.3-7-11-7-11S5 10.7 5 15a7 7 0 0 0 7 7z"/></svg>;
    const IconSoda = () => <svg className="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 2v20M5 12h14M12 7l5 5-5 5"/></svg>;
    const IconFood = () => <svg className="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
    const IconCoins = () => <svg className="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="8" cy="8" r="6"/><circle cx="18" cy="18" r="4"/><path d="M12 18a6 6 0 0 0-6-6"/></svg>;
    const IconChevronDown = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>;
    const IconChevronUp = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>;
    const IconChevronRight = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>;
    const IconShare = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>;
    const IconCopy = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
    const IconDownload = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IconReceipt = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><path d="M6 8h12"/><path d="M6 12h12"/><path d="M6 16h8"/></svg>;
    const IconBank = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v8"/><path d="M20 8v8"/><path d="M8 8v8"/><path d="M16 8v8"/><rect width="20" height="5" x="2" y="16" rx="1"/></svg>;
    const IconArrowLeft = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h10"/></svg>;

    const loadStoredList = (key) => {
      try {
        const value = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    };

    const saveStoredList = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        // La aplicación sigue funcionando aunque el navegador bloquee el almacenamiento.
      }
    };

    function App() {
      // --- ESTADOS Y PERSISTENCIA (Local Storage) ---
      const [players, setPlayers] = useState(() => loadStoredList('tt_players'));
      
      const [expenses, setExpenses] = useState(() => loadStoredList('tt_expenses'));

      useEffect(() => {
        saveStoredList('tt_players', players);
      }, [players]);

      useEffect(() => {
        saveStoredList('tt_expenses', expenses);
      }, [expenses]);

      // --- ESTADOS DE FORMULARIOS ---
      const [newPlayerName, setNewPlayerName] = useState('');
      
      const [expenseDesc, setExpenseDesc] = useState('');
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expensePayer, setExpensePayer] = useState('');
      const [expenseConsumers, setExpenseConsumers] = useState([]);
      const [expenseCategory, setExpenseCategory] = useState('other');
      
      const [activeTab, setActiveTab] = useState('players'); 
      const [toast, setToast] = useState(null);
      const [expandedPlayers, setExpandedPlayers] = useState({}); 

      const canvasRef = useRef(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const clearAll = () => {
        if(window.confirm("¿Seguro que querés reiniciar todas las cuentas? Esto borrará todos los datos cargados.")){
          setPlayers([]);
          setExpenses([]);
          setExpenseDesc('');
          setExpenseAmount('');
          setExpensePayer('');
          setExpenseConsumers([]);
          setExpandedPlayers({});
          setActiveTab('players');
          localStorage.removeItem('tt_players');
          localStorage.removeItem('tt_expenses');
          showToast('Aplicación reiniciada', 'info');
        }
      };

      // --- JUGADORES ---
      const handleAddPlayer = (e) => {
        e.preventDefault();
        if (!newPlayerName.trim()) return;
        
        const newId = `p_${Date.now()}`;
        const newPlayer = { 
          id: newId, 
          name: newPlayerName.trim(),
          alias: '' 
        };
        
        setPlayers([...players, newPlayer]);
        setNewPlayerName('');
        
        if (players.length === 0) setExpensePayer(newId);
        setExpenseConsumers(prev => [...prev, newId]);
        showToast(`${newPlayer.name} agregado`);
      };

      const handleDeletePlayer = (id) => {
        const playerToDelete = players.find(p => p.id === id);
        setPlayers(players.filter(p => p.id !== id));
        setExpenses(expenses.filter(e => e.paidById !== id).map(e => ({
          ...e, consumerIds: e.consumerIds.filter(cid => cid !== id)
        })).filter(e => e.consumerIds.length > 0));
        showToast(`${playerToDelete?.name} eliminado`);
      };

      const togglePlayerExpanded = (playerId) => {
        setExpandedPlayers(prev => ({ ...prev, [playerId]: !prev[playerId] }));
      };

      const handleUpdateAlias = (id, newAlias) => {
        setPlayers(players.map(p => p.id === id ? { ...p, alias: newAlias } : p));
      };

      // --- LÓGICA DE DIVISIÓN ---
      const toggleFormConsumer = (id) => {
        if (expenseConsumers.includes(id)) {
          setExpenseConsumers(expenseConsumers.filter(cid => cid !== id));
        } else {
          setExpenseConsumers([...expenseConsumers, id]);
        }
      };

      const toggleAllConsumers = () => {
        if (expenseConsumers.length === players.length) setExpenseConsumers([]);
        else setExpenseConsumers(players.map(p => p.id));
      };

      const handleAddExpense = (e) => {
        e.preventDefault();
        if (!expenseDesc.trim()) { showToast('Por favor, ingresa una descripción', 'error'); return; }
        const amount = parseFloat(expenseAmount);
        if (isNaN(amount) || amount <= 0) { showToast('El monto debe ser un número mayor a 0', 'error'); return; }
        if (!expensePayer) { showToast('Debe haber alguien que pague el gasto', 'error'); return; }
        if (expenseConsumers.length === 0) { showToast('Al menos una persona debe consumir este artículo', 'error'); return; }

        const newExpense = {
          id: `e_${Date.now()}`, description: expenseDesc.trim(), amount,
          paidById: expensePayer, consumerIds: [...expenseConsumers], category: expenseCategory
        };

        setExpenses([...expenses, newExpense]);
        setExpenseDesc(''); setExpenseAmount(''); setExpenseConsumers(players.map(p => p.id)); setExpenseCategory('other');
        showToast('Gasto agregado correctamente');
      };

      const handleDeleteExpense = (id) => {
        setExpenses(expenses.filter(e => e.id !== id));
        showToast('Gasto eliminado', 'info');
      };

      const roundUpToCentena = (val) => Math.ceil(val / 100) * 100;

      const calculations = useMemo(() => {
        const balances = {}; const individualSpending = {}; const individualPaid = {}; const playerUsageDetails = {};

        players.forEach(p => {
          balances[p.id] = 0; individualSpending[p.id] = 0; individualPaid[p.id] = 0; playerUsageDetails[p.id] = [];
        });

        expenses.forEach(exp => {
          const { amount, paidById, consumerIds, description } = exp;
          if (players.some(p => p.id === paidById)) {
            balances[paidById] += amount; individualPaid[paidById] += amount;
          }
          const share = amount / consumerIds.length;
          consumerIds.forEach(cid => {
            if (balances[cid] !== undefined) {
              balances[cid] -= share; individualSpending[cid] += share;
              playerUsageDetails[cid].push({ description, totalAmount: amount, consumersCount: consumerIds.length, yourShare: share });
            }
          });
        });

        const totalSpent = expenses.reduce((sum, e) => sum + e.amount, 0);

        let debtors = []; let creditors = [];
        Object.keys(balances).forEach(id => {
          const balance = balances[id];
          const player = players.find(p => p.id === id);
          if (!player) return;
          if (balance < -0.01) debtors.push({ id, name: player.name, balance: Math.abs(balance) });
          else if (balance > 0.01) creditors.push({ id, name: player.name, balance });
        });

        debtors.sort((a, b) => b.balance - a.balance);
        creditors.sort((a, b) => b.balance - a.balance);

        const transactions = [];
        let i = 0; let j = 0;

        while (i < debtors.length && j < creditors.length) {
          const debtor = debtors[i];
          const creditor = creditors[j];
          const payment = Math.min(debtor.balance, creditor.balance);
          
          const creditorPlayer = players.find(p => p.id === creditor.id);

          transactions.push({
            from: debtor.name,
            to: creditor.name,
            toAlias: creditorPlayer?.alias || '',
            amountExact: payment,
            amountRounded: roundUpToCentena(payment) 
          });

          debtor.balance -= payment; creditor.balance -= payment;
          if (debtor.balance < 0.01) i++;
          if (creditor.balance < 0.01) j++;
        }

        return { balances, individualSpending, individualPaid, playerUsageDetails, totalSpent, transactions };
      }, [players, expenses]);

          text += `💵 💵 *$${t.amountRounded.toLocaleString('es-AR')}*\n`;
          text += `(Monto exacto sin redondeo: $${Math.round(t.amountExact).toLocaleString('es-AR')})\n`;
          text += `━━━━━━━━━━━━━━━━━━━━━\n`;

        text += `\nGenerado con ⚽ *Tercer Tiempo FMSC* & LeaRama Dev 📱`;
        return text;

      const handleShareWhatsAppText = () => {

        if (window.ReactNativeWebView) {

      const handleCopyText = () => {
        const rawText = getRawTextResult();
        if (!rawText) { showToast('No hay transacciones para copiar', 'error'); return; }
        navigator.clipboard.writeText(rawText).then(() => showToast('¡Texto copiado al portapapeles! Listo para enviar.')).catch(() => showToast('Error al copiar el texto', 'error'));
      };

      const handleGenerateAndDownloadReceipt = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = 600; const itemHeight = 100; const headerHeight = 160; const footerHeight = 100;
        const calculatedHeight = headerHeight + (calculations.transactions.length * itemHeight) + footerHeight;
        
        canvas.width = width; canvas.height = calculatedHeight;

        // Fondo claro
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, calculatedHeight);
        ctx.fillStyle = '#059669'; ctx.fillRect(0, 0, width, 15); // Borde top

        ctx.fillStyle = '#111827'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('⚽ TERCER TIEMPO FMSC - PAGOS ⚽', width / 2, 55);

        ctx.fillStyle = '#4b5563'; ctx.font = '16px sans-serif';
        ctx.fillText(`Gasto Total: $${calculations.totalSpent.toLocaleString('es-AR')} | ${players.length} Integrantes`, width / 2, 85);
        ctx.fillStyle = '#059669'; ctx.font = 'italic 13px sans-serif';
        ctx.fillText('Nota: Los montos sugeridos están redondeados a la centena', width / 2, 110);

        ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(40, 130); ctx.lineTo(width - 40, 130); ctx.stroke();

        let currentY = headerHeight;
        calculations.transactions.forEach((t) => {
          ctx.fillStyle = '#f8fafc'; ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(30, currentY - 10, width - 60, itemHeight - 15, 12);
          else ctx.rect(30, currentY - 10, width - 60, itemHeight - 15);
          ctx.fill();
          ctx.strokeStyle = '#e2e8f0'; ctx.stroke();

          ctx.fillStyle = '#ef4444'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
          ctx.fillText(t.from, 50, currentY + 22);
          ctx.fillStyle = '#6b7280'; ctx.font = '11px sans-serif'; ctx.fillText('Debe transferir', 50, currentY + 40);

          ctx.fillStyle = '#9ca3af'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('➔', width / 2 - 10, currentY + 25);
          ctx.fillStyle = '#059669'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(`$${t.amountRounded.toLocaleString('es-AR')}`, width / 2 - 10, currentY + 50);

          ctx.fillStyle = '#10b981'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'right';
          ctx.fillText(t.to, width - 50, currentY + 22);
          
          ctx.fillStyle = '#6b7280'; ctx.font = '11px sans-serif';
          ctx.fillText(t.toAlias ? `Alias: ${t.toAlias}` : 'Efectivo/Sin Alias', width - 50, currentY + 40);
          
          currentY += itemHeight;
        });

        ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(40, currentY - 10); ctx.lineTo(width - 40, currentY - 10); ctx.stroke();

        ctx.fillStyle = '#6b7280'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Generado gratis con Tercer Tiempo FMSC', width / 2, currentY + 25);
        ctx.font = 'bold 12px sans-serif'; ctx.fillText('¡Evitemos las deudas y disfrutemos del fútbol! ⚽', width / 2, currentY + 45);

        const imageURI = canvas.toDataURL('image/png');
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'DOWNLOAD_IMAGE', payload: imageURI }));
        } else {

          document.body.appendChild(link); link.click(); document.body.removeChild(link);

        }
      };

                              type="text"
                              value={player.alias || ''}
                              onChange={(e) => handleUpdateAlias(player.id, e.target.value)}
                              placeholder="Alias, CBU o CVU (Opcional)"
                              className="w-full bg-white border border-gray-200 rounded-lg pl-9 pr-3 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all shadow-sm"
                            />
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  <button 
                    onClick={() => setActiveTab('summary')}
                    className="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md transition flex items-center justify-center gap-2 active:scale-95"
                  >
                    Ver Liquidación Final <IconCheck />
                  </button>
                </div>
              </div>
            )}

            {/* --- PESTAÑA 3: CUENTAS --- */}
            {activeTab === 'summary' && (
              <div className="flex flex-col gap-6 animate-fade-in">
                
                <div className="grid grid-cols-3 gap-3">
                  <div className="summary-stat bg-white p-3.5 rounded-2xl border border-gray-200 shadow-sm text-center">
                    <span className="text-[9px] text-gray-500 uppercase font-extrabold block mb-1">Total</span>
                    <span className="text-sm font-black text-gray-900">${calculations.totalSpent.toLocaleString('es-AR')}</span>
                  </div>
                  <div className="summary-stat bg-white p-3.5 rounded-2xl border border-gray-200 shadow-sm text-center">
                    <span className="text-[9px] text-gray-500 uppercase font-extrabold block mb-1">Gente</span>
                    <span className="text-sm font-black text-gray-900">{players.length}</span>
                  </div>
                  <div className="summary-stat bg-white p-3.5 rounded-2xl border border-gray-200 shadow-sm text-center">
                    <span className="text-[9px] text-gray-500 uppercase font-extrabold block mb-1">Transf.</span>
                    <span className="text-sm font-black text-indigo-600">{calculations.transactions.length}</span>
                  </div>
                </div>

                <div className="panel-card bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex flex-col gap-4">
                  <div className="flex flex-col gap-1.5 border-b border-gray-100 pb-3">
                    <h2 className="text-sm font-extrabold text-gray-800 flex items-center gap-2">
                      <span className="bg-emerald-100 text-emerald-600 p-1.5 rounded-lg"><IconReceipt /></span>
                      ¿Quién le paga a quién?
                    </h2>
                  </div>

                  {calculations.transactions.length === 0 ? (
                    <div className="py-8 text-center bg-gray-50 border border-gray-100 rounded-xl">
                      <p className="font-extrabold text-gray-400 text-sm">¡Nadie debe plata!</p>
                      <p className="text-[11px] text-gray-400 mt-1">Las cuentas están perfectas.</p>
                    </div>
                  ) : (
                    <div className="flex flex-col gap-3">
                      {calculations.transactions.map((t, idx) => (
                        <div key={idx} className="bg-gray-50 border border-gray-200 rounded-xl p-4 flex flex-col shadow-sm">
                          <div className="flex items-center justify-between">
                            <div className="flex flex-col">
                              <span className="font-extrabold text-gray-900 text-sm">{t.from}</span>
                              <span className="text-[10px] text-red-500 font-bold">Transfiere</span>
                            </div>
                            
                            <div className="flex flex-col items-center">
                              <span className="text-sm font-black text-emerald-600">${t.amountRounded.toLocaleString('es-AR')}</span>
                              <span className="text-[10px] text-gray-400 font-bold">➔</span>
                            </div>

                            <div className="flex flex-col text-right">
                              <span className="font-extrabold text-gray-900 text-sm">{t.to}</span>
                              <span className="text-[10px] text-emerald-600 font-bold">Recibe</span>
                            </div>
                          </div>
                          
                          {/* Datos Bancarios Opcionales y Monto Exacto */}
                          <div className="bg-white rounded-lg p-2.5 mt-3 border border-gray-100 flex flex-col gap-2">
                             <div className="flex items-center gap-2 text-gray-700 text-xs font-bold">
                               <IconBank />
                               <span>{t.toAlias ? `Alias: ${t.toAlias}` : 'Efectivo / Sin Alias'}</span>
                             </div>
                             <div className="text-[10px] text-gray-500 font-medium flex justify-between border-t border-gray-50 pt-2">
                               <span>Monto exacto matemático:</span>
                               <span className="text-gray-700 font-bold">${Math.round(t.amountExact).toLocaleString('es-AR')}</span>
                             </div>
                          </div>
                        </div>
                      ))}

                      <div className="grid grid-cols-1 gap-2.5 pt-2">
                        <button onClick={handleShareWhatsAppText} className="w-full bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold py-3.5 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 active:scale-95 transition">
                          <IconShare /> Enviar por WhatsApp
                        </button>
                        <div className="grid grid-cols-2 gap-2.5">
                          <button onClick={handleCopyText} className="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-2 rounded-xl text-xs flex items-center justify-center gap-1.5 active:scale-95 transition border border-gray-200">
                            <IconCopy /> Copiar
                          </button>
                          <button onClick={handleGenerateAndDownloadReceipt} className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold py-3 px-2 rounded-xl text-xs flex items-center justify-center gap-1.5 active:scale-95 transition">
                            <IconDownload /> Ticket
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {/* Resumen Individual */}
                <div className="panel-card bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex flex-col gap-4">
                  <div className="border-b border-gray-100 pb-2">
                    <h2 className="text-sm font-extrabold text-gray-800">Detalle Individual</h2>
                    <p className="text-xs text-gray-500 font-medium">Tocá un nombre para auditar las cuentas</p>
                  </div>

                  <div className="flex flex-col gap-3">
                    {players.map(player => {
                      const paid = calculations.individualPaid[player.id] || 0;
                      const spent = calculations.individualSpending[player.id] || 0;
                      const net = paid - spent;
                      const isExpanded = !!expandedPlayers[player.id];
                      const consumedItems = calculations.playerUsageDetails[player.id] || [];

                      return (
                        <div key={player.id} className="bg-gray-50 border border-gray-200 rounded-xl overflow-hidden transition-all shadow-sm">
                          <button onClick={() => togglePlayerExpanded(player.id)} className="w-full p-3.5 flex items-center justify-between text-left focus:outline-none">
                            <div className="flex items-center gap-2">
                              <span className="text-sm font-bold text-gray-900">{player.name}</span>
                              {isExpanded ? <IconChevronUp /> : <IconChevronDown />}
                            </div>
                            <span className={`text-[10px] font-extrabold px-2.5 py-1 rounded-md shadow-sm ${
                              net > 0.01 ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : net < -0.01 ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-gray-200 text-gray-600'
                            }`}>
                              {net > 0.01 ? `Recibe $${Math.round(net).toLocaleString('es-AR')}` : net < -0.01 ? `Debe $${Math.abs(Math.round(net)).toLocaleString('es-AR')}` : 'Al día'}
                            </span>
                          </button>

                          {isExpanded && (
                            <div className="bg-white border-t border-gray-100 p-4 flex flex-col gap-3">
                              <div className="flex justify-between text-[11px] text-gray-600 pb-2 border-b border-gray-50 bg-gray-50 p-2 rounded-lg">
                                <div className="flex flex-col">
                                  <span className="font-medium">Consumió</span>
                                  <strong className="text-gray-900 text-xs">${Math.round(spent).toLocaleString('es-AR')}</strong>
                                </div>
                                <div className="flex flex-col text-right">
                                  <span className="font-medium">Aportó</span>
                                  <strong className="text-gray-900 text-xs">${Math.round(paid).toLocaleString('es-AR')}</strong>
                                </div>
                              </div>
                              <span className="text-[10px] uppercase font-extrabold text-gray-400 tracking-wider">Desglose de compras:</span>
                              {consumedItems.length === 0 ? (
                                <span className="text-xs text-gray-500 italic">No consumió nada.</span>
                              ) : (
                                <div className="flex flex-col gap-2">
                                  {consumedItems.map((item, idx) => (
                                    <div key={idx} className="flex justify-between items-start text-xs bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                                      <div className="flex flex-col">
                                        <span className="font-bold text-gray-800">{item.description}</span>
                                        <span className="text-[10px] text-gray-500 font-medium">Total: ${item.totalAmount.toLocaleString('es-AR')} ÷ {item.consumersCount} pers.</span>
                                      </div>
                                      <span className="font-extrabold text-gray-900 shrink-0">+${Math.round(item.yourShare).toLocaleString('es-AR')}</span>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
            )}
          </main>

          <footer className="app-footer">
            <p>⚽ Tercer Tiempo FMSC · Lea Rama Dev</p>
          </footer>

          <canvas ref={canvasRef} className="hidden" />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
