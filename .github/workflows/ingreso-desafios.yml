name: Ingreso - controles de Desafíos

on:
  pull_request:
    paths:
      - 'ingreso-belgrano-monserrat/**'
      - '.github/workflows/ingreso-desafios.yml'
  push:
    branches: [main]
    paths:
      - 'ingreso-belgrano-monserrat/**'
      - '.github/workflows/ingreso-desafios.yml'

permissions:
  contents: read

jobs:
  probar-desafios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Abrir pestaña y activar los tres bloques
        run: node --test ingreso-belgrano-monserrat/tests/desafios-smoke.test.cjs
