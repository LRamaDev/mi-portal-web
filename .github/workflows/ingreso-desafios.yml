name: Ingreso - controles de Desafíos

on:
  pull_request:
    paths:
      - 'ingreso-belgrano-monserrat/**'
      - '.github/workflows/ingreso-desafios.yml'
  push:
    branches: [main]
    paths:
      - 'ingreso-belgrano-monserrat/**'
      - '.github/workflows/ingreso-desafios.yml'

permissions:
  contents: read

jobs:
  probar-desafios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar acceso y corrección de Matemática y Ortografía
        run: node --test ingreso-belgrano-monserrat/tests/desafios-smoke.test.cjs ingreso-belgrano-monserrat/tests/ortografia-smoke.test.cjs ingreso-belgrano-monserrat/tests/ampliacion-desafios-v6-32.test.cjs ingreso-belgrano-monserrat/tests/estados-desafios-v6-34.test.cjs ingreso-belgrano-monserrat/tests/transferencia-retencion-v6-35.test.cjs ingreso-belgrano-monserrat/tests/ultima-semana-v6-36.test.cjs
