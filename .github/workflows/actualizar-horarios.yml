name: Actualizar horarios interurbanos

on:
  push:
    branches:
      - "actualizacion/**"
    paths:
      - "datos-fuente/transporte/*.pdf"
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Rama que contiene los ocho PDF"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: horarios-${{ github.event.inputs.source_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  procesar:
    name: Extraer, validar y preparar publicación
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Descargar la rama de carga
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/transporte/requirements.txt

      - name: Instalar el extractor
        run: python -m pip install --requirement scripts/transporte/requirements.txt

      - name: Controlar la carga
        id: carga
        shell: bash
        run: |
          mapfile -d '' pdfs < <(find datos-fuente/transporte -maxdepth 1 -type f -iname '*.pdf' -print0 | sort -z)
          if [ "${#pdfs[@]}" -ne 8 ]; then
            echo "Se esperaban exactamente 8 PDF y se encontraron ${#pdfs[@]}." >&2
            exit 1
          fi
          printf '%s\n' "${pdfs[@]}"

      - name: Conservar los PDF durante 30 días
        uses: actions/upload-artifact@v4
        with:
          name: cronogramas-${{ github.run_number }}
          path: datos-fuente/transporte/*.pdf
          retention-days: 30
          compression-level: 0

      - name: Extraer, comparar y actualizar el historial
        id: datos
        shell: bash
        run: |
          mapfile -d '' pdfs < <(find datos-fuente/transporte -maxdepth 1 -type f -iname '*.pdf' -print0 | sort -z)
          cp app-transporte/data/horarios.json "$RUNNER_TEMP/horarios-anteriores.json"
          cp app-transporte/data/cabeceras.json "$RUNNER_TEMP/cabeceras-anteriores.json"
          python scripts/transporte/procesar_cronogramas.py \
            "${pdfs[@]}" \
            --latest-per-corridor \
            --output "$RUNNER_TEMP/horarios-nuevos.json"
          python scripts/transporte/generar_cabeceras.py \
            --schedule "$RUNNER_TEMP/horarios-nuevos.json" \
            --existing "$RUNNER_TEMP/cabeceras-anteriores.json" \
            --output "$RUNNER_TEMP/cabeceras-nuevas.json"
          python scripts/transporte/validar_datos_transporte.py \
            --schedule "$RUNNER_TEMP/horarios-nuevos.json" \
            --locations "$RUNNER_TEMP/cabeceras-nuevas.json"
          python scripts/transporte/comparar_horarios.py \
            --old "$RUNNER_TEMP/horarios-anteriores.json" \
            --new "$RUNNER_TEMP/horarios-nuevos.json" \
            --old-locations "$RUNNER_TEMP/cabeceras-anteriores.json" \
            --new-locations "$RUNNER_TEMP/cabeceras-nuevas.json" \
            --output "$RUNNER_TEMP/informe-horarios.md" \
            --json-output "$RUNNER_TEMP/cambios-horarios.json"
          publication_date=$(jq -r '[.sources[].publication_date] | map(select(. != null)) | max' "$RUNNER_TEMP/horarios-nuevos.json")
          if [ -z "$publication_date" ] || [ "$publication_date" = "null" ]; then
            echo "No se pudo determinar la fecha de publicación." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/historico"
          if [ -d app-transporte/data/historico ]; then
            cp -R app-transporte/data/historico/. "$RUNNER_TEMP/historico/"
          fi
          python scripts/transporte/actualizar_historial.py \
            --old "$RUNNER_TEMP/horarios-anteriores.json" \
            --new "$RUNNER_TEMP/horarios-nuevos.json" \
            --old-locations "$RUNNER_TEMP/cabeceras-anteriores.json" \
            --new-locations "$RUNNER_TEMP/cabeceras-nuevas.json" \
            --routes app-transporte/data/recorridos.json \
            --changes "$RUNNER_TEMP/cambios-horarios.json" \
            --history-dir "$RUNNER_TEMP/historico"
          echo "date=$publication_date" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/informe-horarios.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Conservar el informe detallado durante 90 días
        uses: actions/upload-artifact@v4
        with:
          name: informe-horarios-${{ steps.datos.outputs.date }}
          path: |
            ${{ runner.temp }}/informe-horarios.md
            ${{ runner.temp }}/cambios-horarios.json
          retention-days: 90

      - name: Preparar la rama de publicación
        id: publicacion
        shell: bash
        env:
          PUBLICATION_DATE: ${{ steps.datos.outputs.date }}
        run: |
          publish_branch="publicacion/horarios-$PUBLICATION_DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch --force-create "$publish_branch" origin/main
          cp "$RUNNER_TEMP/horarios-nuevos.json" app-transporte/data/horarios.json
          cp "$RUNNER_TEMP/cabeceras-nuevas.json" app-transporte/data/cabeceras.json
          mkdir -p app-transporte/data/historico
          cp -R "$RUNNER_TEMP/historico/." app-transporte/data/historico/
          git add app-transporte/data/horarios.json app-transporte/data/cabeceras.json app-transporte/data/historico
          if git diff --cached --quiet; then
            echo "Los PDF no producen cambios respecto de la publicación vigente." >&2
            exit 1
          fi
          git commit -m "Actualizar horarios e historial al $PUBLICATION_DATE"
          git push --force origin "$publish_branch"
          echo "branch=$publish_branch" >> "$GITHUB_OUTPUT"
          echo "date=$PUBLICATION_DATE" >> "$GITHUB_OUTPUT"

      - name: Crear o actualizar el Pull Request
        shell: bash
        env:
          PUBLISH_BRANCH: ${{ steps.publicacion.outputs.branch }}
          PUBLICATION_DATE: ${{ steps.publicacion.outputs.date }}
        run: |
          if pr_url=$(gh pr list --head "$PUBLISH_BRANCH" --base main --state open --json url --jq '.[0].url') && [ -n "$pr_url" ]; then
            gh pr edit "$pr_url" \
              --title "Actualizar horarios interurbanos al $PUBLICATION_DATE" \
              --body-file "$RUNNER_TEMP/informe-horarios.md"
          else
            pr_url=$(gh pr create \
              --base main \
              --head "$PUBLISH_BRANCH" \
              --title "Actualizar horarios interurbanos al $PUBLICATION_DATE" \
              --body-file "$RUNNER_TEMP/informe-horarios.md")
          fi
          printf '\n## Pull Request preparado\n\n%s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
