name: Corrector IA POC - pruebas sin datos reales
on:
  pull_request:
    paths:
      - 'supabase/functions/corrector-ia-poc/**'
      - '.github/workflows/test-corrector-ia-poc.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar rúbrica, benchmark humano y datos ficticios
        run: |
          node --test supabase/functions/corrector-ia-poc/rubrica.test.mjs
          node --test supabase/functions/corrector-ia-poc/benchmark/comparar.test.mjs
