name: Ingreso V6.8 - repaso espaciado

on:
  pull_request:
    paths:
      - 'ingreso-belgrano-monserrat/**'
      - 'index.html'
      - 'tests/ingreso-v6-7-auditoria.test.cjs'
      - 'tests/ingreso-v6-8-repaso.test.cjs'
      - 'tests/ingreso-v6-8-2-opciones.test.cjs'
      - 'tests/ingreso-visitante-portal.test.cjs'
      - 'tests/ingreso-version-visible.test.cjs'
      - 'tests/ingreso-v6-12-videos.test.cjs'
      - 'tests/ingreso-v6-16-estabilidad.test.cjs'
      - 'tests/ingreso-v6-17-guia-belgrano.test.cjs'
      - 'tests/ingreso-v6-18-evidencia.test.cjs'
      - 'tools/auditar-ingreso-v6-7.cjs'
      - 'audit-bank.cjs'
      - '.github/workflows/ingreso-v6-8-repaso.yml'
  push:
    branches: [main]
    paths:
      - 'ingreso-belgrano-monserrat/**'
      - 'index.html'
      - 'tests/ingreso-v6-7-auditoria.test.cjs'
      - 'tests/ingreso-v6-8-repaso.test.cjs'
      - 'tests/ingreso-v6-8-2-opciones.test.cjs'
      - 'tests/ingreso-visitante-portal.test.cjs'
      - 'tests/ingreso-version-visible.test.cjs'
      - 'tools/auditar-ingreso-v6-7.cjs'
      - 'audit-bank.cjs'

permissions:
  contents: read

jobs:
  probar-v68:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Auditoría pedagógica V6.7
        run: node --test tests/ingreso-v6-7-auditoria.test.cjs
      - name: Banco efectivo V6.18
        run: node audit-bank.cjs
      - name: Repaso espaciado V6.8
        run: node --test tests/ingreso-v6-8-repaso.test.cjs
      - name: Opciones múltiples V6.8.2
        run: node --test tests/ingreso-v6-8-2-opciones.test.cjs
      - name: Modo visitante y acceso desde portal
        run: node --test tests/ingreso-visitante-portal.test.cjs
      - name: Versión visible
        run: node --test tests/ingreso-version-visible.test.cjs
      - name: Videos en la app
        run: node --test tests/ingreso-v6-12-videos.test.cjs
      - name: Estabilidad y progresión V6.16
        run: node --test tests/ingreso-v6-16-estabilidad.test.cjs
      - name: Guía Belgrano 2026 V6.17
        run: node --test tests/ingreso-v6-17-guia-belgrano.test.cjs
      - name: Evidencia pedagógica V6.18
        run: node --test tests/ingreso-v6-18-evidencia.test.cjs
