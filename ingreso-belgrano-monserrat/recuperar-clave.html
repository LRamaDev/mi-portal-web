<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f6b">
  <meta name="robots" content="noindex, nofollow">
  <title>Recuperar contraseña · Ingreso Belgrano/Monserrat</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eaf3fb,#f8fbff);color:#173f6b;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(480px,100%);background:#fff;border:1px solid #dce5ed;border-radius:22px;padding:clamp(20px,5vw,32px);box-shadow:0 18px 55px rgba(23,63,107,.13)}
    h1{font-size:1.45rem;line-height:1.25;margin:0 0 10px}
    p{color:#526679}
    label{display:block;margin:18px 0 6px;font-weight:650}
    input{width:100%;padding:12px 14px;border:1px solid #aebfce;border-radius:10px;font:inherit}
    input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #5a9fe0;outline-offset:2px}
    button{width:100%;margin-top:18px;padding:12px;background:#173f6b;color:#fff;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    a{color:#175aa0}
    .status{margin:10px 0;color:#526679}
    .error{color:#a52727}
    .success{color:#176653}
    .foot{margin-top:22px;font-size:.93rem}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <p style="font-size:.85rem;font-weight:750;letter-spacing:.04em">PREPARACIÓN DE INGRESO</p>
    <h1>Belgrano · Monserrat</h1>
    <p>Recuperación de contraseña de la cuenta familiar.</p>
    <p id="status" class="status" role="status" aria-live="polite">Verificando el enlace seguro…</p>
    <form id="recovery-form" hidden>
      <label for="password">Nueva contraseña (mínimo 8 caracteres)</label>
      <input id="password" type="password" minlength="8" required autocomplete="new-password">
      <label for="confirm-password">Repetir contraseña</label>
      <input id="confirm-password" type="password" minlength="8" required autocomplete="new-password">
      <button id="save-password" type="submit">Guardar nueva contraseña</button>
    </form>
    <p class="foot"><a href="./">Volver a la aplicación</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=6.18.2"></script>
  <script>
    (() => {
      'use strict';
      const status = document.getElementById('status');
      const form = document.getElementById('recovery-form');
      const button = document.getElementById('save-password');
      const fromRecoveryLink = new URLSearchParams(location.hash.slice(1)).get('type') === 'recovery';
      const cfg = window.INGRESO_CONFIG || {};
      let client = null;
      let verified = false;

      const report = (message, kind = '') => {
        status.textContent = message;
        status.className = 'status ' + kind;
      };
      const clearRecoveryUrl = () => {
        // Evita conservar tokens de recuperación en la barra de direcciones.
        if (location.hash) history.replaceState(null, '', location.pathname);
      };
      const allowPasswordChange = () => {
        verified = true;
        clearRecoveryUrl();
        form.hidden = false;
        report('Enlace validado. Elegí tu nueva contraseña.');
      };
      const rejectRecovery = () => {
        clearRecoveryUrl();
        report('El enlace no es válido o venció. Solicitá uno nuevo desde el acceso familiar de la aplicación.', 'error');
      };

      if (!fromRecoveryLink || !window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey) {
        rejectRecovery();
        return;
      }

      client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      client.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' && session?.user) allowPasswordChange();
      });

      client.auth.getSession().then(({data, error}) => {
        if (verified) return;
        if (error || !data?.session?.user) rejectRecovery();
        else allowPasswordChange();
      }).catch(() => rejectRecovery());

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!verified || !client) return;
        const newPassword = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;
        if (newPassword.length < 8) {
          report('Elegí una contraseña de al menos 8 caracteres.', 'error');
          return;
        }
        if (newPassword !== confirm) {
          report('Las dos contraseñas no coinciden.', 'error');
          return;
        }
        button.disabled = true;
        button.textContent = 'Guardando…';
        try {
          const {error} = await client.auth.updateUser({password: newPassword});
          if (error) throw error;
          form.hidden = true;
          form.reset();
          verified = false;
          clearRecoveryUrl();
          try { await client.auth.signOut({scope:'local'}); } catch (_) {}
          report('¡Contraseña actualizada! Volvé a la aplicación e ingresá con tu correo y la clave nueva.', 'success');
        } catch (error) {
          console.error('[Ingreso] Error al actualizar contraseña:', error?.message || 'Error de autenticación');
          report('No se pudo actualizar la contraseña. Probá otra clave o solicitá un nuevo enlace.', 'error');
        } finally {
          button.disabled = false;
          button.textContent = 'Guardar nueva contraseña';
        }
      });
    })();
  </script>
</body>
</html>
